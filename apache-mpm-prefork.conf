# Substitui /etc/apache2/mods-available/mpm_prefork.conf das cópias do WordPress.
# Igual ao padrão da imagem, exceto MaxRequestWorkers (padrão 150), que vem da
# variável APACHE_MAX_WORKERS do docker-compose.yml.
#
# Cada processo do Apache ocupa ~12 MB sob carga. Com 10 cópias x 150 processos
# a máquina (15 GB) ficava sem memória na alta carga; com 40 por cópia, 10
# cópias usam no máximo ~5 GB.
<IfModule mpm_prefork_module>
	StartServers			 5
	MinSpareServers		  5
	MaxSpareServers		 10
	MaxRequestWorkers	  ${APACHE_MAX_WORKERS}
	MaxConnectionsPerChild   0
</IfModule>
