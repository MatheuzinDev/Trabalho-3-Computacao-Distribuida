# Em relação ao nginx.conf do Trabalho 2, só mudam as 3 linhas abaixo: o
# original (1 processo, 1024 conexões) virava o gargalo dos testes de carga,
# com erros 500 "Too many open files" já com ~1000 usuários.
worker_processes auto;        # 1 processo por núcleo (o original usa só 1)
worker_rlimit_nofile 65535;   # mais arquivos/conexões abertas por processo
events { worker_connections 16384; } # original: 1024 conexões por processo
http {
  upstream wordpress { # pool de servidores
      # O DNS do Docker devolve o IP de TODAS as cópias do serviço "wordpress".
      # O Nginx só consulta essa lista ao iniciar ou recarregar (nginx -s reload).
      server wordpress:80;
  }
  server {
      listen 80 default_server;
      listen [::]:80 default_server;
      root /usr/share/nginx/html;
      index index.php;
      location / {
        add_header X-Upstream $upstream_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header x-forwarded-for $proxy_add_x_forwarded_for;
        proxy_pass http://wordpress;
      }
  }
}
